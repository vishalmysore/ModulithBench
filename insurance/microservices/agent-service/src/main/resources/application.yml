spring:
  application:
    name: agentdb
  datasource:
    url: jdbc:postgresql://agentdb:5432/agentdb
    username: agentuser
    password: agentpass
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

server:
  port: 8104
  servlet:
    context-path: /api/v1
