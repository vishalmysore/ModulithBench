version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthcare-postgres
    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: healthcareuser
      POSTGRES_PASSWORD: healthcarepass
    ports:
      - "5433:5432"
    volumes:
      - healthcare_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcareuser -d healthcare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  healthcare-monolith:
    build: .
    container_name: healthcare-monolith
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/healthcare_db
      SPRING_DATASOURCE_USERNAME: healthcareuser
      SPRING_DATASOURCE_PASSWORD: healthcarepass

volumes:
  healthcare_data:
