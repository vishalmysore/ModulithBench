user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream patient-service {
        server patient-service:8091;
    }
    upstream doctor-service {
        server doctor-service:8092;
    }
    upstream appointment-service {
        server appointment-service:8093;
    }
    upstream medicalrecord-service {
        server medicalrecord-service:8094;
    }
    upstream prescription-service {
        server prescription-service:8095;
    }
    upstream billing-service {
        server billing-service:8096;
    }
    upstream department-service {
        server department-service:8097;
    }

    server {
        listen 8001;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 "{\"status\": \"healthy\"}";
            add_header Content-Type application/json;
        }

        # API routes
        location /patient-service/ {
            proxy_pass http://patient-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /doctor-service/ {
            proxy_pass http://doctor-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /appointment-service/ {
            proxy_pass http://appointment-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /medicalrecord-service/ {
            proxy_pass http://medicalrecord-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /prescription-service/ {
            proxy_pass http://prescription-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /billing-service/ {
            proxy_pass http://billing-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /department-service/ {
            proxy_pass http://department-service/api/v1/;
            proxy_set_header Host $host;
        }

        # Default 404
        location / {
            return 404;
        }
    }
}