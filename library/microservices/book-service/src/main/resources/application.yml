spring:
  application:
    name: bookdb
  datasource:
    url: jdbc:postgresql://bookdb:5432/bookdb
    username: bookuser
    password: bookpass
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

server:
  port: 8081
  servlet:
    context-path: /api/v1
