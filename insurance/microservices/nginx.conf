user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream customer-service {
        server customer-service:8101;
    }
    upstream policy-service {
        server policy-service:8102;
    }
    upstream claim-service {
        server claim-service:8103;
    }
    upstream agent-service {
        server agent-service:8104;
    }
    upstream premium-service {
        server premium-service:8105;
    }
    upstream settlement-service {
        server settlement-service:8106;
    }
    upstream coverage-service {
        server coverage-service:8107;
    }

    server {
        listen 8002;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 "{\"status\": \"healthy\"}";
            add_header Content-Type application/json;
        }

        # API routes
        location /customer-service/ {
            proxy_pass http://customer-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /policy-service/ {
            proxy_pass http://policy-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /claim-service/ {
            proxy_pass http://claim-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /agent-service/ {
            proxy_pass http://agent-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /premium-service/ {
            proxy_pass http://premium-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /settlement-service/ {
            proxy_pass http://settlement-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /coverage-service/ {
            proxy_pass http://coverage-service/api/v1/;
            proxy_set_header Host $host;
        }

        # Default 404
        location / {
            return 404;
        }
    }
}