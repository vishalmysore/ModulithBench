spring:
  application:
    name: appointmentdb
  datasource:
    url: jdbc:postgresql://appointmentdb:5432/appointmentdb
    username: appointmentuser
    password: appointmentpass
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

server:
  port: 8093
  servlet:
    context-path: /api/v1
