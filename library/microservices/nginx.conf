user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream book-service {
        server book-service:8081;
    }
    upstream member-service {
        server member-service:8082;
    }
    upstream loan-service {
        server loan-service:8083;
    }
    upstream fine-service {
        server fine-service:8084;
    }
    upstream reservation-service {
        server reservation-service:8085;
    }

    server {
        listen 8000;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 "{\"status\": \"healthy\"}";
            add_header Content-Type application/json;
        }

        # API routes
        location /book-service/ {
            proxy_pass http://book-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /member-service/ {
            proxy_pass http://member-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /loan-service/ {
            proxy_pass http://loan-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /fine-service/ {
            proxy_pass http://fine-service/api/v1/;
            proxy_set_header Host $host;
        }
        location /reservation-service/ {
            proxy_pass http://reservation-service/api/v1/;
            proxy_set_header Host $host;
        }

        # Default 404
        location / {
            return 404;
        }
    }
}